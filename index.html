<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Receiver</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
  #screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #code{font-size:12vw;letter-spacing:.2em;font-weight:700;margin:2vh 0}
  p{font-size:2.4vw;color:#bbb;margin:0}
  button{font-size:3vw;padding:1.5vh 4vw;border:0;border-radius:12px;background:#1a73e8;color:#fff}
  button:focus{outline:6px solid #fff}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
</style>
</head>
<body>
  <div id="screen">
    <div id="intro"><p style="margin-bottom:4vh">Press OK on your remote to start</p><button id="go" autofocus>Start receiver</button></div>
    <div id="pair" style="display:none">
      <p>Enter this code in the Chrome extension</p>
      <div id="code">······</div>
      <p id="msg">Connecting…</p>
    </div>
  </div>
  <video id="video" autoplay playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let peer;

    function newCode() { return String(Math.floor(100000 + Math.random() * 900000)); }

    function register() {
      const code = newCode();
      peer = new Peer("tvshare-" + code);
      peer.on("open", () => { $("code").textContent = code; $("msg").textContent = "Waiting for your computer…"; });
      peer.on("error", (e) => {
        if (e.type === "unavailable-id") { peer.destroy(); register(); }
        else { $("msg").textContent = "Error: " + e.type + " — retrying…"; setTimeout(() => { peer.destroy(); register(); }, 3000); }
      });
      peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
      peer.on("call", (call) => {
        call.answer();
        call.on("stream", (s) => {
          $("video").srcObject = s;
          $("video").style.display = "block";
          $("screen").style.display = "none";
          $("video").play().catch(() => {});
        });
        const end = () => {
          $("video").srcObject = null;
          $("video").style.display = "none";
          $("screen").style.display = "flex";
          $("msg").textContent = "Waiting for your computer…";
        };
        call.on("close", end);
        call.on("error", end);
      });
    }

    $("go").onclick = () => {
      $("intro").style.display = "none";
      $("pair").style.display = "block";
      register();
    };
    $("go").focus();
  </script>
</body>
</html>
